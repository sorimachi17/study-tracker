name: Apply recent stats list UI

on:
  push:
    paths:
      - '.github/workflows/apply-recent-list-ui.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/scripts/apply_recent_list_ui.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-recent-list-ui.yml .github/scripts/apply_recent_list_ui.py
          git add index.html
          git commit -m "Replace recent stats selectors with history lists"
          git push origin main
