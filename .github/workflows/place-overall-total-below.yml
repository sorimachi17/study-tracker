name: Place overall total below target total
on:
  push:
    paths:
      - '.github/workflows/place-overall-total-below.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply overall total placement
        run: python3 .github/scripts/place_overall_total_below.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/place-overall-total-below.yml .github/scripts/place_overall_total_below.py
          git add index.html
          git commit -m "Place overall total below target total"
          git push origin main
