name: Group recent records by month
on:
  push:
    paths:
      - '.github/workflows/group-recent-by-month.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply monthly recent grouping
        run: python3 .github/scripts/group_recent_by_month.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/group-recent-by-month.yml .github/scripts/group_recent_by_month.py
          git add index.html
          git commit -m "Group recent records by month"
          git push origin main
