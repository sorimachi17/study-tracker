name: Fix today card mobile UI

on:
  push:
    paths:
      - '.github/workflows/fix-today-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/scripts/fix_today_card.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-today-card.yml .github/scripts/fix_today_card.py
          git add index.html
          git commit -m "Fix mobile today study card layout"
          git push origin main
