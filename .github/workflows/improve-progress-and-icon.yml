name: Improve progress summary and app icon
on:
  push:
    paths:
      - '.github/workflows/improve-progress-and-icon.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update app UI and PWA files
        run: python3 .github/scripts/improve_progress_and_icon.py
      - name: Generate PNG app icons
        run: |
          set -e
          if command -v convert >/dev/null 2>&1; then
            convert -background none app-icon.svg -resize 180x180 app-icon-180.png
            convert -background none app-icon.svg -resize 192x192 app-icon-192.png
            convert -background none app-icon.svg -resize 512x512 app-icon-512.png
          elif command -v rsvg-convert >/dev/null 2>&1; then
            rsvg-convert -w 180 -h 180 app-icon.svg -o app-icon-180.png
            rsvg-convert -w 192 -h 192 app-icon.svg -o app-icon-192.png
            rsvg-convert -w 512 -h 512 app-icon.svg -o app-icon-512.png
          else
            python3 -m pip install --quiet cairosvg
            python3 - <<'PY'
          import cairosvg
          for size in (180,192,512):
              cairosvg.svg2png(url='app-icon.svg', write_to=f'app-icon-{size}.png', output_width=size, output_height=size)
          PY
          fi
          test -s app-icon-180.png
          test -s app-icon-192.png
          test -s app-icon-512.png
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/improve-progress-and-icon.yml .github/scripts/improve_progress_and_icon.py
          git add index.html manifest.webmanifest sw.js app-icon.svg app-icon-180.png app-icon-192.png app-icon-512.png
          git commit -m "Improve goal progress summary and app icon"
          git push origin main
