name: Apply simplified history layout

on:
  push:
    paths:
      - '.github/workflows/apply-history-layout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/scripts/simplify_history_layout.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-history-layout.yml .github/scripts/simplify_history_layout.py
          git add index.html
          git commit -m "Simplify history and add edit section"
          git push origin main
