name: Fix record default date
on:
  push:
    paths:
      - '.github/workflows/fix-record-default-date.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set record date to today
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function openRecordModal(){renderCategorySelect();renderSelectedDay();setDefaultEntryEndTime();"
          new="function openRecordModal(){renderCategorySelect();const calendarSelectedDate=selectedDate;selectedDate=todayKey();renderSelectedDay();selectedDate=calendarSelectedDate;setDefaultEntryEndTime();"
          if old not in s:
              raise SystemExit('openRecordModal target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-record-default-date.yml
          git add index.html
          git commit -m "Default new records to today"
          git push origin main
