name: Apply configurable study target

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-configurable-target.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update app
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, name):
              global s
              if old not in s:
                  raise SystemExit(f'{name} target not found')
              s = s.replace(old, new, 1)

          rep(
              '.challenge-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.challenge-title h2{margin:0;font-size:14px;color:var(--muted);font-weight:850}',
              '.challenge-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.challenge-title h2{margin:0;font-size:14px;color:var(--muted);font-weight:850}.target-setting{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:850}.target-setting label{margin:0;white-space:nowrap}.target-setting input{width:78px;min-height:36px;padding:6px 8px}.target-setting .btn{min-height:36px;padding:0 10px;font-size:11px}',
              'target CSS'
          )
          rep(
              '.milestones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:18px}.milestone{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;display:flex;flex-direction:column}.milestone span{order:1;color:var(--muted);font-size:11px;font-weight:850}.milestone strong{order:2;font-size:20px;margin-top:5px}.milestone em{order:3;margin-top:4px;color:var(--muted);font-size:10px;font-style:normal}.status-card{padding:20px;margin-top:14px}',
              '.milestones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-top:18px}.milestone{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;display:flex;flex-direction:column}.milestone span{order:1;color:var(--muted);font-size:11px;font-weight:850}.milestone strong{order:2;font-size:20px;margin-top:5px}.milestone em{order:3;margin-top:4px;color:var(--muted);font-size:10px;font-style:normal}.progress-kpis{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.status-card{padding:20px;margin-top:14px}',
              'milestone CSS'
          )
          rep(
              '.chart-goal-label{font-size:20px}.day{height:58px;padding:5px}',
              '.chart-goal-label{font-size:20px}.challenge-title{align-items:flex-start;flex-direction:column}.target-setting{width:100%}.target-setting input{flex:1;width:auto}.day{height:58px;padding:5px}',
              'mobile CSS'
          )

          rep('<h1>英語100時間チャレンジ</h1>', '<h1 id="pageTitle">英語100時間チャレンジ</h1>', 'page title')
          rep(
              '<div class="card progress-card"><div class="challenge-title"><h2>これまでの累計学習時間</h2></div>',
              '<div class="card progress-card"><div class="challenge-title"><h2>これまでの累計学習時間</h2><div class="target-setting"><label for="targetHoursInput">目標</label><input id="targetHoursInput" type="number" min="1" step="1" value="100" /><span>時間</span><button class="btn" id="saveTargetBtn" type="button">変更</button></div></div>',
              'target controls'
          )
          rep(
              '<div class="progress-chart"><div class="progress-chart-head"><h3>累計学習時間の推移</h3><span id="projectionDateLabel">100時間の到達予測 -</span></div>',
              '<div class="progress-chart"><div class="progress-chart-head"><h3>累計学習時間の推移</h3><span id="projectionDateLabel">目標到達予測 -</span></div>',
              'chart heading'
          )
          rep(
              '<div class="milestones"><div class="milestone"><span>100時間まで残り</span><strong id="remaining100">100h</strong><em id="remainingDetail">0% 達成</em></div><div class="milestone"><span>100時間の到達予測</span><strong id="daysTo100">-</strong><em id="paceDetail">-</em></div><div class="milestone"><span>1日の最高学習時間</span><strong id="bestDay">0m</strong><em id="bestDayDate">-</em></div><div class="milestone"><span>1日の平均学習時間</span><strong id="avgDay">0m</strong><em id="avgDayDetail">記録開始から今日まで</em></div></div></div>\n<div class="card status-card"><div class="section-head"><h2>最近の学習時間</h2><span>すべて合計時間</span></div><div class="kpi-grid"><div class="kpi blue"><span>今日の合計</span><strong id="todayMinutes">0m</strong></div><div class="kpi green"><span>今週の合計</span><strong id="weekMinutes">0h</strong></div><div class="kpi amber"><span>今月の合計</span><strong id="monthMinutes">0h</strong></div><div class="kpi"><span>連続学習日数</span><strong id="streakDays">0日</strong></div></div></div></section>',
              '<div class="milestones"><div class="milestone"><span id="targetRemainingLabel">目標まで残り</span><strong id="remaining100">100h</strong><em id="remainingDetail">0% 達成</em></div><div class="milestone"><span id="targetPredictionLabel">目標の到達予測</span><strong id="daysTo100">-</strong><em id="paceDetail">-</em></div><div class="milestone"><span>1日の最高学習時間</span><strong id="bestDay">0m</strong><em id="bestDayDate">-</em></div><div class="milestone"><span>1日の平均学習時間</span><strong id="avgDay">0m</strong><em id="avgDayDetail">記録開始から今日まで</em></div><div class="milestone"><span>経過日数</span><strong id="elapsedDays">0日</strong><em id="elapsedDaysDetail">記録開始から</em></div></div><div class="progress-kpis"><div class="section-head"><h3>最近の学習時間</h3><span>すべて合計時間</span></div><div class="kpi-grid"><div class="kpi blue"><span>今日の合計</span><strong id="todayMinutes">0m</strong></div><div class="kpi green"><span>今週の合計</span><strong id="weekMinutes">0h</strong></div><div class="kpi amber"><span>今月の合計</span><strong id="monthMinutes">0h</strong></div><div class="kpi"><span>連続学習日数</span><strong id="streakDays">0日</strong></div></div></div></div></section>',
              'progress card content'
          )

          rep(
              "const STORAGE={entries:'study-tracker.entries.v2',categories:'study-tracker.categories.v2',goal:'study-tracker.weeklyGoalHours.v2',legacyMigrated:'study-tracker.legacyMigrated.v7'},LEGACY_STORAGE={entries:'studyEntries_v7',categories:'studyCategories_v7',goals:'studyGoals_v7'},FIRST_TARGET_HOURS=100,defaultCategories=['Conversation','Shadowing','Listening','Reading','Vocabulary','Grammar','Writing'];migrateLegacyStorage();let entries=load(STORAGE.entries,[]),categories=load(STORAGE.categories,defaultCategories),weeklyGoalHours=Number(localStorage.getItem(STORAGE.goal)||10),currentMonth=new Date(),selectedDate=todayKey(),calendarView='month';",
              "const STORAGE={entries:'study-tracker.entries.v2',categories:'study-tracker.categories.v2',goal:'study-tracker.weeklyGoalHours.v2',target:'study-tracker.targetHours.v1',legacyMigrated:'study-tracker.legacyMigrated.v7'},LEGACY_STORAGE={entries:'studyEntries_v7',categories:'studyCategories_v7',goals:'studyGoals_v7'},DEFAULT_TARGET_HOURS=100,defaultCategories=['Conversation','Shadowing','Listening','Reading','Vocabulary','Grammar','Writing'];migrateLegacyStorage();let entries=load(STORAGE.entries,[]),categories=load(STORAGE.categories,defaultCategories),weeklyGoalHours=Number(localStorage.getItem(STORAGE.goal)||10),targetHours=Math.max(1,Number(localStorage.getItem(STORAGE.target)||DEFAULT_TARGET_HOURS)),currentMonth=new Date(),selectedDate=todayKey(),calendarView='month';",
              'storage and target state'
          )
          rep(
              "function firstStudyDate(){const ds=entries.map(e=>e.date).filter(Boolean).sort();return ds.length?parseDate(ds[0]):null}function historicalDailyAverage(){const first=firstStudyDate();if(!first)return 0;const today=parseDate(todayKey()),days=Math.max(1,Math.floor((today-first)/DAY_MS)+1);return sumEntries(()=>true)/days}function paceToTarget(remaining){if(remaining<=0)return{primary:'達成',detail:'100時間を突破',date:parseDate(todayKey())};const avg=historicalDailyAverage();if(avg<=0)return{primary:'-',detail:'記録が増えると予測',date:null};const days=Math.ceil(remaining/avg),target=parseDate(todayKey());target.setDate(target.getDate()+days);return{primary:'約'+days+'日後',detail:formatShortDate(dateKey(target))+'ごろ',date:target}}",
              "function firstStudyDate(){const ds=entries.map(e=>e.date).filter(Boolean).sort();return ds.length?parseDate(ds[0]):null}function historicalDailyAverage(){const first=firstStudyDate();if(!first)return 0;const today=parseDate(todayKey()),days=Math.max(1,Math.floor((today-first)/DAY_MS)+1);return sumEntries(()=>true)/days}function paceToTarget(remaining){if(remaining<=0)return{primary:'達成',detail:targetHours+'時間を達成',date:parseDate(todayKey())};const avg=historicalDailyAverage();if(avg<=0)return{primary:'-',detail:'記録が増えると予測',date:null};const days=Math.ceil(remaining/avg),target=parseDate(todayKey());target.setDate(target.getDate()+days);return{primary:'約'+days+'日後',detail:formatShortDate(dateKey(target))+'ごろ',date:target}}",
              'pace function'
          )

          old_dashboard = "function renderDashboard(){const now=new Date(),today=todayKey(),ws=weekStart(now),we=new Date(ws);we.setDate(we.getDate()+6);we.setHours(23,59,59,999);const ms=new Date(now.getFullYear(),now.getMonth(),1),me=new Date(now.getFullYear(),now.getMonth()+1,0,23,59,59,999),todayMin=sumEntries(e=>e.date===today),weekMin=sumEntries(e=>inRange(e.date,ws,we)),monthMin=sumEntries(e=>inRange(e.date,ms,me)),totalMin=sumEntries(()=>true),pct=Math.min(100,totalMin/(FIRST_TARGET_HOURS*60)*100),remaining=Math.max(0,FIRST_TARGET_HOURS*60-totalMin),best=bestDayStats(),pace=paceToTarget(remaining),avgDay=historicalDailyAverage();$('totalHours').textContent=Math.floor(totalMin/60)+'h';$('totalMinutes').textContent=minutesLabel(totalMin%60);$('goalOrbit').style.setProperty('--pct',pct+'%');$('goalOrbitPercent').textContent=Math.round(pct)+'%';$('remaining100').textContent=hoursLabel(remaining,1);$('remainingDetail').textContent=Math.round(pct)+'% 達成';$('daysTo100').textContent=pace.primary;$('paceDetail').textContent=pace.detail;$('bestDay').textContent=minutesLabel(best.minutes);$('bestDayDate').textContent=best.date?formatShortDate(best.date):'-';$('avgDay').textContent=minutesLabel(avgDay);$('avgDayDetail').textContent='記録開始から今日まで';$('todayMinutes').textContent=minutesLabel(todayMin);$('weekMinutes').textContent=minutesLabel(weekMin);$('monthMinutes').textContent=minutesLabel(monthMin);$('streakDays').textContent=calculateStreak()+'日'}"
          new_dashboard = "function renderDashboard(){const now=new Date(),today=todayKey(),ws=weekStart(now),we=new Date(ws);we.setDate(we.getDate()+6);we.setHours(23,59,59,999);const ms=new Date(now.getFullYear(),now.getMonth(),1),me=new Date(now.getFullYear(),now.getMonth()+1,0,23,59,59,999),todayMin=sumEntries(e=>e.date===today),weekMin=sumEntries(e=>inRange(e.date,ws,we)),monthMin=sumEntries(e=>inRange(e.date,ms,me)),totalMin=sumEntries(()=>true),targetMin=targetHours*60,pct=Math.min(100,totalMin/targetMin*100),remaining=Math.max(0,targetMin-totalMin),best=bestDayStats(),pace=paceToTarget(remaining),avgDay=historicalDailyAverage(),first=firstStudyDate(),elapsedDays=first?Math.max(0,Math.floor((parseDate(todayKey())-first)/DAY_MS)):0;$('pageTitle').textContent='英語'+targetHours+'時間チャレンジ';$('targetHoursInput').value=targetHours;$('targetRemainingLabel').textContent=targetHours+'時間まで残り';$('targetPredictionLabel').textContent=targetHours+'時間の到達予測';$('totalHours').textContent=Math.floor(totalMin/60)+'h';$('totalMinutes').textContent=minutesLabel(totalMin%60);$('goalOrbit').style.setProperty('--pct',pct+'%');$('goalOrbitPercent').textContent=Math.round(pct)+'%';$('remaining100').textContent=hoursLabel(remaining,1);$('remainingDetail').textContent=Math.round(pct)+'% 達成';$('daysTo100').textContent=pace.primary;$('paceDetail').textContent=pace.detail;$('bestDay').textContent=minutesLabel(best.minutes);$('bestDayDate').textContent=best.date?formatShortDate(best.date):'-';$('avgDay').textContent=minutesLabel(avgDay);$('avgDayDetail').textContent='記録開始から今日まで';$('elapsedDays').textContent=elapsedDays+'日';$('elapsedDaysDetail').textContent=first?formatShortDate(dateKey(first))+'から':'-';$('todayMinutes').textContent=minutesLabel(todayMin);$('weekMinutes').textContent=minutesLabel(weekMin);$('monthMinutes').textContent=minutesLabel(monthMin);$('streakDays').textContent=calculateStreak()+'日'}"
          rep(old_dashboard, new_dashboard, 'dashboard')

          rep("label.textContent='100時間の到達予測 -'", "label.textContent=targetHours+'時間の到達予測 -'", 'empty chart label')
          rep("Math.max(0,FIRST_TARGET_HOURS*60-total)", "Math.max(0,targetHours*60-total)", 'chart remaining')
          rep("if(remaining<=0){label.textContent='100時間達成'}", "if(remaining<=0){label.textContent=targetHours+'時間達成'}", 'chart achieved label')
          rep("Math.max(FIRST_TARGET_HOURS*60,total)", "Math.max(targetHours*60,total)", 'chart y max')
          rep("goalY=y(FIRST_TARGET_HOURS*60).toFixed(1)", "goalY=y(targetHours*60).toFixed(1)", 'chart goal y')
          rep("text-anchor=\"end\">100h</text>", "text-anchor=\"end\">'+targetHours+'h</text>", 'chart goal text')

          insert_before = "$('entryForm').addEventListener('submit',event=>{"
          target_handler = "$('saveTargetBtn').addEventListener('click',()=>{const v=Math.round(Number($('targetHoursInput').value));if(!Number.isFinite(v)||v<1){showToast('目標時間を入力してください');return}targetHours=v;localStorage.setItem(STORAGE.target,String(targetHours));renderDashboard();renderProgressChart();showToast('目標を'+targetHours+'時間に変更しました')});"
          if target_handler not in s:
              if insert_before not in s:
                  raise SystemExit('target handler insertion point not found')
              s = s.replace(insert_before, target_handler + insert_before, 1)

          rep(
              "$('exportJsonBtn').addEventListener('click',()=>download('study-tracker-backup.json',JSON.stringify({entries,categories,weeklyGoalHours},null,2),'application/json'))",
              "$('exportJsonBtn').addEventListener('click',()=>download('study-tracker-backup.json',JSON.stringify({entries,categories,weeklyGoalHours,targetHours},null,2),'application/json'))",
              'export target'
          )
          rep(
              "weeklyGoalHours=Number(data.weeklyGoalHours||10);save(STORAGE.entries,entries);save(STORAGE.categories,categories);localStorage.setItem(STORAGE.goal,String(weeklyGoalHours));renderAll();",
              "weeklyGoalHours=Number(data.weeklyGoalHours||10);targetHours=Math.max(1,Number(data.targetHours||targetHours||DEFAULT_TARGET_HOURS));save(STORAGE.entries,entries);save(STORAGE.categories,categories);localStorage.setItem(STORAGE.goal,String(weeklyGoalHours));localStorage.setItem(STORAGE.target,String(targetHours));renderAll();",
              'import target'
          )

          p.write_text(s, encoding='utf-8')

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-configurable-target.yml
          git commit -m "Add configurable study target and consolidate progress stats"
          git push
