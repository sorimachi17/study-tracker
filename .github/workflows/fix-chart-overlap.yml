name: Fix mobile chart overlap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-chart-overlap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile chart
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_top = 'T=mobile?28:22'
          new_top = 'T=mobile?46:22'
          old_css = '.chart-axis-title,.chart-goal-label{font-size:20px}'
          new_css = '.chart-axis-title{display:none}.chart-goal-label{font-size:20px}'

          if old_top not in s:
              raise SystemExit('mobile chart top padding pattern not found')
          if old_css not in s:
              raise SystemExit('mobile chart title css pattern not found')

          s = s.replace(old_top, new_top, 1)
          s = s.replace(old_css, new_css, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-chart-overlap.yml
          git commit -m "Fix mobile progress chart label overlap"
          git push
