name: Apply projection callout UI once
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-inputs-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch projection callouts and summary card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          css = r'''
          /* projection-callouts-v13 */
          .projection-callout-box{stroke-width:1.4}
          .projection-callout.latest .projection-callout-box{fill:var(--greenSoft);stroke:var(--green)}
          .projection-callout.previous .projection-callout-box{fill:var(--surface2);stroke:var(--line)}
          .projection-callout-leader{stroke-width:1.4;fill:none}
          .projection-callout.latest .projection-callout-leader{stroke:var(--green);opacity:.75}
          .projection-callout.previous .projection-callout-leader{stroke:var(--muted);opacity:.7}
          .projection-callout-title{font-size:13px;font-weight:900}
          .projection-callout.latest .projection-callout-title{fill:var(--green)}
          .projection-callout.previous .projection-callout-title{fill:var(--muted)}
          .projection-callout-date{font-size:20px;font-weight:950;fill:var(--text)}
          .projection-callout-days{font-size:12px;font-weight:850;fill:var(--muted)}
          .projection-callout.latest .projection-callout-days{fill:var(--green)}
          .milestone.prediction .prediction-kpi{order:2;margin-top:7px;display:grid;gap:4px}
          .milestone.prediction .prediction-kpi-row{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:baseline;gap:5px}
          .milestone.prediction .prediction-kpi-row em{order:initial!important;margin:0!important;color:var(--muted);font-size:11px!important;font-style:normal;font-weight:800;line-height:1.25}
          .milestone.prediction .prediction-kpi-row strong{order:initial!important;margin:0!important;font-size:16px!important;line-height:1.2!important;letter-spacing:-.01em;white-space:nowrap}
          .milestone.prediction .prediction-kpi-row.latest strong{color:var(--green)}
          .milestone.prediction .prediction-delta{margin-top:2px;color:var(--green);font-size:11px;font-weight:900;line-height:1.3}
          .milestone.prediction .prediction-delta.worse{color:var(--red)}
          .milestone.prediction .prediction-delta.same{color:var(--muted)}
          @media(max-width:620px){
            .projection-callout-title{font-size:12px}
            .projection-callout-date{font-size:18px}
            .projection-callout-days{font-size:11px}
            .milestone.prediction .prediction-kpi-row{grid-template-columns:38px minmax(0,1fr);gap:4px}
            .milestone.prediction .prediction-kpi-row strong{font-size:15px!important}
          }
          '''
          if 'projection-callouts-v13' not in s:
              s = s.replace('</style>', css + '\n</style>')

          old_card = '<div class="milestone prediction"><span id="targetPredictionLabel">到達予測</span><strong id="daysTo100">-</strong><em id="paceDetail">-</em></div>'
          new_card = '<div class="milestone prediction"><span id="targetPredictionLabel">到達予測</span><div class="prediction-kpi"><div class="prediction-kpi-row latest"><em>最新：</em><strong id="daysTo100">-</strong></div><div class="prediction-kpi-row previous"><em>昨日：</em><strong id="previousPredictionDate">-</strong></div><div class="prediction-delta" id="targetDeltaDetail">-</div></div></div>'
          if old_card in s:
              s = s.replace(old_card, new_card)

          pat = re.compile(r"\$\('daysTo100'\)\.textContent=.*?;\$\('bestDay'\)\.textContent", re.S)
          rep = r'''$('daysTo100').textContent=latest.date?formatShortDate(dateKey(latest.date)):'-';const previousPredictionDate=$('previousPredictionDate'),targetDeltaDetail=$('targetDeltaDetail');if(previousPredictionDate)previousPredictionDate.textContent=previous&&previous.date?formatShortDate(dateKey(previous.date)):'-';if(targetDeltaDetail){targetDeltaDetail.className='prediction-delta';if(previous&&previous.date&&latest.date){if(delta>0)targetDeltaDetail.textContent='昨日から '+delta+'日短縮';else if(delta<0){targetDeltaDetail.textContent='昨日から '+Math.abs(delta)+'日後退';targetDeltaDetail.classList.add('worse')}else{targetDeltaDetail.textContent='昨日と同じ';targetDeltaDetail.classList.add('same')}}else if(latest.days!=null){targetDeltaDetail.textContent='あと'+latest.days+'日';targetDeltaDetail.classList.add('same')}else{targetDeltaDetail.textContent='記録が増えると予測';targetDeltaDetail.classList.add('same')}}$('bestDay').textContent'''
          s, n = pat.subn(rep, s, count=1)
          if n != 1:
              raise SystemExit(f'dashboard patch failed: {n}')

          if 'function decorateProjectionChart()' not in s:
              if 'function renderProgressChart(){' not in s:
                  raise SystemExit('renderProgressChart not found')
              s = s.replace('function renderProgressChart(){', 'function renderProgressChartBase(){', 1)
              decorator = r'''
          function decorateProjectionChart(){
            const wrap=$('cumulativeChart'),svg=wrap&&wrap.querySelector('svg');
            if(!svg)return;
            const today=parseDate(todayKey()),yesterday=new Date(today);yesterday.setDate(yesterday.getDate()-1);
            const start=parseDate(effectiveTargetStartDate()),latest=targetProjectionAsOf(todayKey()),previous=yesterday>=start?targetProjectionAsOf(dateKey(yesterday)):null;
            const legendLatest=$('projectionLegendLatest'),legendPrev=$('projectionLegendPrevious');
            if(legendLatest)legendLatest.textContent='最新の到達予測';
            if(legendPrev)legendPrev.textContent='昨日の到達予測';
            const parts=(svg.getAttribute('viewBox')||'0 0 500 350').split(/\s+/).map(Number),W=parts[2]||500,mobile=W<=500,R=mobile?30:28;
            const lineMid=line=>line?{x:(Number(line.getAttribute('x1'))+Number(line.getAttribute('x2')))/2,y:(Number(line.getAttribute('y1'))+Number(line.getAttribute('y2')))/2}:null;
            const latestLine=svg.querySelector('.chart-projection-latest'),previousLine=svg.querySelector('.chart-projection-previous'),lm=lineMid(latestLine),pm=lineMid(previousLine);
            const latestText=latest&&latest.date?formatShortDate(dateKey(latest.date)):'-',previousText=previous&&previous.date?formatShortDate(dateKey(previous.date)):'-';
            let html='';
            if(latest&&latest.date&&lm){
              const bw=mobile?164:190,bh=mobile?88:94,bx=mobile?178:385,by=mobile?70:48;
              html+='<g class="projection-callout latest"><line class="projection-callout-leader" x1="'+(bx+bw)+'" y1="'+(by+bh*.55)+'" x2="'+lm.x.toFixed(1)+'" y2="'+lm.y.toFixed(1)+'"></line><rect class="projection-callout-box" x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" rx="10"></rect><text class="projection-callout-title" x="'+(bx+14)+'" y="'+(by+22)+'">最新の到達予測</text><text class="projection-callout-date" x="'+(bx+14)+'" y="'+(by+49)+'">'+latestText+'</text><text class="projection-callout-days" x="'+(bx+14)+'" y="'+(by+72)+'">あと'+latest.days+'日</text></g>';
            }
            if(previous&&previous.date&&pm){
              const bw=mobile?156:182,bh=mobile?88:94,bx=mobile?Math.min(W-R-156,312):Math.min(W-R-182,710),by=mobile?178:152;
              html+='<g class="projection-callout previous"><line class="projection-callout-leader" x1="'+bx+'" y1="'+(by+bh*.45)+'" x2="'+pm.x.toFixed(1)+'" y2="'+pm.y.toFixed(1)+'"></line><rect class="projection-callout-box" x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" rx="10"></rect><text class="projection-callout-title" x="'+(bx+14)+'" y="'+(by+22)+'">昨日の到達予測</text><text class="projection-callout-date" x="'+(bx+14)+'" y="'+(by+49)+'">'+previousText+'</text><text class="projection-callout-days" x="'+(bx+14)+'" y="'+(by+72)+'">あと'+previous.days+'日</text></g>';
            }
            if(html)svg.insertAdjacentHTML('beforeend',html);
          }
          function renderProgressChart(){renderProgressChartBase();decorateProjectionChart()}
          '''
              s = s.replace('function level(', decorator + 'function level(', 1)

          p.write_text(s)

          sw = Path('sw.js')
          if sw.exists():
              t = sw.read_text()
              m = re.search(r'study-tracker-pwa-v(\d+)', t)
              if m:
                  t = t.replace(m.group(0), f"study-tracker-pwa-v{int(m.group(1))+1}", 1)
                  sw.write_text(t)
          PY
      - name: Commit UI update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Add projection callouts and prediction summary"
          git push
