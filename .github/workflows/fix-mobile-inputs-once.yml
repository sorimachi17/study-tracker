name: Fix projection chart labels once
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-inputs-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix overlapping projection chart date labels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          old = "xTicks=[start];if(today>start&&today<x1Date)xTicks.push(today);if(x1Date>start)xTicks.push(x1Date);const uniqueTicks="
          new = "xTicks=[start],minTickGap=mobile?72:90;if(today>start&&today<x1Date&&x(today)-x(start)>=minTickGap&&x(x1Date)-x(today)>=minTickGap)xTicks.push(today);if(x1Date>start)xTicks.push(x1Date);const uniqueTicks="
          if old not in s:
              raise SystemExit('target chart tick code not found')
          p.write_text(s.replace(old, new, 1))

          sw = Path('sw.js')
          t = sw.read_text()
          t = t.replace("study-tracker-pwa-v5", "study-tracker-pwa-v6")
          sw.write_text(t)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Fix overlapping projection chart date labels"
          git push
