name: Add projection comparison UI once
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-inputs-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch projection comparison UI
        run: echo '' | base64 -d | python3
      - name: Commit projection comparison UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Compare yesterday and latest study projections"
          git push
