name: Apply projection callout UI once
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-inputs-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch projection callouts and summary card
        run: |
          echo ' bW9iaWxlPzIyOjE4KSsnIj7nm67mqJnmnJ/pgpM8L3RleHQ+PHRleHQgY2xhc3M9ImNoYXJ0LWdvYWwtbGFiZWwiIHg9IicrKFctUikrJyIgeT0iJys ' | base64 -d > /tmp/patch_projection_ui.py
          python3 /tmp/patch_projection_ui.py
      - name: Commit UI update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Add projection callouts and prediction summary"
          git push
