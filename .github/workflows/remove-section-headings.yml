name: Remove redundant section headings
on:
  push:
    paths:
      - '.github/workflows/remove-section-headings.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply section heading cleanup
        run: python3 .github/scripts/remove-section-headings.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-section-headings.yml .github/scripts/remove-section-headings.py
          git add index.html
          git commit -m "Simplify section headings"
          git push origin main
