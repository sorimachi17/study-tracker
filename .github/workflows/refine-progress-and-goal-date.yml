name: Refine progress and goal date
on:
  push:
    paths:
      - '.github/workflows/refine-progress-and-goal-date.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply progress and date refinements
        run: python3 .github/scripts/refine_progress_and_goal_date.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-progress-and-goal-date.yml .github/scripts/refine_progress_and_goal_date.py
          git add index.html
          git commit -m "Refine progress summary and goal date input"
          git push origin main
