name: Fix category select
on:
  push:
    paths:
      - '.github/workflows/fix-category-select.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply category select fix
        run: python3 .github/scripts/fix-category-select.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-category-select.yml .github/scripts/fix-category-select.py
          git add index.html
          git commit -m "Fix category selection in study records"
          git push origin main
