name: Rename study tracker labels once

on:
  push:
    paths:
      - '.github/workflows/rename-labels-once.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('累計学習時間の推移', '学習時間の推移')
          s = s.replace('<span>連続学習日数</span>', '<span>現在の連続学習日数</span>')
          p.write_text(s)
          PY
          rm .github/workflows/rename-labels-once.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/rename-labels-once.yml
          git commit -m 'Update study tracker labels'
          git push
