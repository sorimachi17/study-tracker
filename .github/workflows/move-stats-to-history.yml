name: Move study stats to history

on:
  push:
    paths:
      - '.github/workflows/move-stats-to-history.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/scripts/move_stats_to_history.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/move-stats-to-history.yml .github/scripts/move_stats_to_history.py
          git add index.html
          git commit -m "Move study summaries into history views"
          git push origin main
