name: Stabilize record sheet
on:
  push:
    paths:
      - '.github/workflows/stabilize-record-sheet.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/stabilize_record_sheet.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Stabilize mobile record sheet and align inputs"
            git push
          fi
