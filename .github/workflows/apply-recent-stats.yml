name: Apply selectable recent study stats

on:
  push:
    paths:
      - '.github/workflows/apply-recent-stats.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/scripts/apply_recent_stats.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-recent-stats.yml .github/scripts/apply_recent_stats.py
          git add index.html
          git commit -m "Add selectable day week and month study stats"
          git push origin main
