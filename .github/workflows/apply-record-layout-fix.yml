name: Apply record layout fix
on:
  push:
    paths:
      - '.github/workflows/apply-record-layout-fix.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_record_layout_remove_sentences.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/scripts/fix_record_layout_remove_sentences.py .github/workflows/apply-record-layout-fix.yml
          git commit -m "Fix record layout and remove sentence UI"
          git push
