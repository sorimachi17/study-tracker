name: Fix mobile progress UI

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-progress-ui.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/scripts/fix_mobile_progress_ui.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-mobile-progress-ui.yml .github/scripts/fix_mobile_progress_ui.py
          git add index.html
          git commit -m "Fix mobile progress cards layout"
          git push origin main
