name: Fix recent record overlap
on:
  push:
    paths:
      - '.github/workflows/fix-recent-record-overlap.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply recent record overlap fix
        run: python3 .github/scripts/fix-recent-record-overlap.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-recent-record-overlap.yml .github/scripts/fix-recent-record-overlap.py
          git add index.html
          git commit -m "Fix overlap in recent record cards"
          git push origin main
