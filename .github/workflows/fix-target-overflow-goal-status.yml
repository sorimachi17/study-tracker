name: Fix target overflow and goal status
on:
  push:
    paths:
      - '.github/workflows/fix-target-overflow-goal-status.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply UI fix
        run: python3 .github/scripts/fix_target_overflow_and_goal_status.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-target-overflow-goal-status.yml .github/scripts/fix_target_overflow_and_goal_status.py
          git add index.html sw.js
          git commit -m "Fix target overflow and add today summary"
          git push origin main
