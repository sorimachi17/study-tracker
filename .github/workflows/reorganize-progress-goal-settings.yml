name: Reorganize progress and goal settings
on:
  push:
    paths:
      - '.github/workflows/reorganize-progress-goal-settings.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply UI update
        run: python3 .github/scripts/reorganize_progress_goal_settings.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reorganize-progress-goal-settings.yml .github/scripts/reorganize_progress_goal_settings.py
          git add index.html
          git commit -m "Reorganize progress KPIs and goal settings"
          git push origin main
