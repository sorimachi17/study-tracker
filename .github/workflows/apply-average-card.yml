name: Apply average study time card update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-average-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
              (
                  '.milestones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:18px}',
                  '.milestones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:18px}'
              ),
              (
                  '<div class="milestones"><div class="milestone"><span>100時間まで残り</span><strong id="remaining100">100h</strong><em id="remainingDetail">0% 達成</em></div><div class="milestone"><span>100時間の到達予測</span><strong id="daysTo100">-</strong><em id="paceDetail">記録が増えると精度UP</em></div><div class="milestone"><span>1日の最高学習時間</span><strong id="bestDay">0m</strong><em id="bestDayDate">-</em></div></div>',
                  '<div class="milestones"><div class="milestone"><span>100時間まで残り</span><strong id="remaining100">100h</strong><em id="remainingDetail">0% 達成</em></div><div class="milestone"><span>100時間の到達予測</span><strong id="daysTo100">-</strong><em id="paceDetail">-</em></div><div class="milestone"><span>1日の最高学習時間</span><strong id="bestDay">0m</strong><em id="bestDayDate">-</em></div><div class="milestone"><span>1日の平均学習時間</span><strong id="avgDay">0m</strong><em id="avgDayDetail">記録開始から今日まで</em></div></div>'
              ),
              (
                  "return{primary:'約'+days+'日後',detail:'平均 '+minutesLabel(avg)+'/日 ・ '+formatShortDate(dateKey(target))+'ごろ',date:target}",
                  "return{primary:'約'+days+'日後',detail:formatShortDate(dateKey(target))+'ごろ',date:target}"
              ),
              (
                  "best=bestDayStats(),pace=paceToTarget(remaining);",
                  "best=bestDayStats(),pace=paceToTarget(remaining),avgDay=historicalDailyAverage();"
              ),
              (
                  "$('bestDayDate').textContent=best.date?formatShortDate(best.date):'-';$('todayMinutes')",
                  "$('bestDayDate').textContent=best.date?formatShortDate(best.date):'-';$('avgDay').textContent=minutesLabel(avgDay);$('avgDayDetail').textContent='記録開始から今日まで';$('todayMinutes')"
              ),
              (
                  "label.textContent='予測 '+formatShortDate(dateKey(target))+'（平均 '+minutesLabel(avg)+'/日）'",
                  "label.textContent='予測 '+formatShortDate(dateKey(target))"
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('replacement target not found: ' + old[:80])
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-average-card.yml
          git commit -m "Simplify target forecast and add daily average card"
          git push
