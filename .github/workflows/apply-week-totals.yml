name: Apply history weekly totals UI
on:
  push:
    paths:
      - '.github/workflows/apply-week-totals.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/add_week_totals.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-week-totals.yml .github/scripts/add_week_totals.py
          git add index.html
          git commit -m "Improve monthly totals and add weekly totals"
          git push
