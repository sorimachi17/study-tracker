name: Apply mobile chart fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-chart-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chart
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('.legend-line.projection{background:linear-gradient(90deg,var(--green) 0 55%,transparent 55% 72%,var(--green) 72%)}', '')
          s = s.replace('.chart-projection{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round;stroke-dasharray:10 8}', '')
          s = s.replace('.chart-wrap{height:330px}.chart-axis-text{font-size:17px}.chart-axis-title,.chart-goal-label{font-size:15px}', '.chart-wrap{height:340px}.chart-axis-text{font-size:24px}.chart-axis-title,.chart-goal-label{font-size:20px}')
          s = s.replace('<div class="chart-legend"><span><i class="legend-line"></i>実績</span><span><i class="legend-line projection"></i>これまでの平均ペース</span></div>', '<div class="chart-legend"><span><i class="legend-line"></i>実績</span></div>')

          old = re.compile(r"function chartDateLabel\(d\)\{return\(d\.getMonth\(\)\+1\)\+'/'\+d\.getDate\(\)\}function renderProgressChart\(\)\{.*?\}function level\(", re.S)
          new = """function chartDateLabel(d){return(d.getMonth()+1)+'/'+d.getDate()}function renderProgressChart(){const el=$('cumulativeChart'),label=$('projectionDateLabel'),daily={};entries.forEach(e=>daily[e.date]=(daily[e.date]||0)+Number(e.minutes||0));const dates=Object.keys(daily).sort();if(!dates.length){el.innerHTML='<div class=\"empty\">記録すると、ここに累計時間の推移が表示されます。</div>';label.textContent='100時間の到達予測 -';return}const first=parseDate(dates[0]),today=parseDate(todayKey()),points=[];let total=0,d=new Date(first);while(d<=today){const k=dateKey(d);total+=daily[k]||0;points.push({date:new Date(d),minutes:total});d.setDate(d.getDate()+1)}const remaining=Math.max(0,FIRST_TARGET_HOURS*60-total),avg=historicalDailyAverage();if(remaining<=0){label.textContent='100時間達成'}else if(avg>0){const target=new Date(today);target.setDate(target.getDate()+Math.ceil(remaining/avg));label.textContent='予測 '+formatShortDate(dateKey(target))+'（平均 '+minutesLabel(avg)+'/日）'}else label.textContent='100時間の到達予測 -';const mobile=window.innerWidth<=620,yMax=Math.max(FIRST_TARGET_HOURS*60,total),W=mobile?500:1000,H=mobile?350:340,L=mobile?88:74,R=mobile?18:28,T=mobile?28:22,B=mobile?64:54,pw=W-L-R,ph=H-T-B,x0=first.getTime(),x1=Math.max(today.getTime(),x0+DAY_MS),x=dt=>L+(dt.getTime()-x0)/(x1-x0)*pw,y=m=>T+(1-m/yMax)*ph,actual=points.map(p=>x(p.date).toFixed(1)+','+y(p.minutes).toFixed(1)).join(' '),yTicks=[0,.25,.5,.75,1].map(v=>yMax*v),spanDays=Math.max(1,Math.round((x1-x0)/DAY_MS)),xFractions=spanDays<14?[0,1]:[0,.5,1],xTicks=xFractions.map(v=>new Date(x0+(x1-x0)*v)),gy=yTicks.map(v=>'<line class=\"chart-grid\" x1=\"'+L+'\" y1=\"'+y(v).toFixed(1)+'\" x2=\"'+(W-R)+'\" y2=\"'+y(v).toFixed(1)+'\"></line><text class=\"chart-axis-text\" x=\"'+(L-(mobile?14:12))+'\" y=\"'+(y(v)+(mobile?8:5)).toFixed(1)+'\" text-anchor=\"end\">'+(v/60).toFixed(v%60?1:0)+'h</text>').join(''),gx=xTicks.map(v=>'<text class=\"chart-axis-text\" x=\"'+x(v).toFixed(1)+'\" y=\"'+(H-(mobile?20:17))+'\" text-anchor=\"middle\">'+chartDateLabel(v)+'</text>').join(''),goalY=y(FIRST_TARGET_HOURS*60).toFixed(1);el.innerHTML='<svg class=\"chart-svg\" viewBox=\"0 0 '+W+' '+H+'\" role=\"img\" aria-label=\"日付ごとの累計学習時間\"><line class=\"chart-goal\" x1=\"'+L+'\" y1=\"'+goalY+'\" x2=\"'+(W-R)+'\" y2=\"'+goalY+'\"></line>'+gy+'<text class=\"chart-axis-title\" x=\"'+(mobile?8:14)+'\" y=\"'+(mobile?22:18)+'\">累計時間</text><text class=\"chart-goal-label\" x=\"'+(W-R)+'\" y=\"'+(Number(goalY)-(mobile?10:7))+'\" text-anchor=\"end\">100h</text>'+gx+'<polyline class=\"chart-actual\" points=\"'+actual+'\"></polyline></svg>'}function level("""
          s2, n = old.subn(new, s, count=1)
          if n != 1:
              raise SystemExit(f'chart function replacement failed: {n}')
          p.write_text(s2, encoding='utf-8')

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-mobile-chart-fix.yml
          git commit -m "Fix mobile chart readability and remove projection line"
          git push
