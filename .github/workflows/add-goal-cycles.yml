name: Add goal cycles
on:
  push:
    paths:
      - '.github/workflows/add-goal-cycles.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/add_goal_cycles.py
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m, 'script block missing'
          Path('/tmp/study-tracker.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/study-tracker.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add sequential goal history"
            git push
          fi
