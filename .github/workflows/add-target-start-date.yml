name: Add target start date
on:
  push:
    paths:
      - '.github/workflows/add-target-start-date.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/scripts/add_target_start_date.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-target-start-date.yml .github/scripts/add_target_start_date.py
          git add index.html
          git commit -m "Add target start date"
          git push origin main
